# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - Bilboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Publish Web
        run: dotnet publish ./Bilboard/Bilboard.csproj -c Release -o "${{env.DOTNET_ROOT}}/web"

      - name: Publish API
        run: dotnet publish ./Presentation/Presentation.csproj -c Release -o "${{env.DOTNET_ROOT}}/api"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: bilboard-artifacts
          path: |
            ${{env.DOTNET_ROOT}}/web
            ${{env.DOTNET_ROOT}}/api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: bilboard-artifacts
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_68601CB65CF643ABBABB546DE38E0C64 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_99861BAFA9CD48ACA9802C708BD4340F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1EE2B27BF2704B3A9487D4C2FF0CD460 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Bilboard'
          slot-name: 'Production'
          package: .
          
      - name: Deploy to Hetzner VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "./"
          target: ${{ secrets.HETZNER_APP_PATH }}

      - name: Restart Hetzner service
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            systemctl daemon-reload
            systemctl restart bilboard.service
            systemctl status bilboard.service --no-pager

      - name: Debug key length
        run: echo "${{ secrets.HETZNER_SSH_KEY }}" | wc -l
