name: Build and deploy Bilboard + Presentation to Azure & Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish Bilboard
        run: dotnet publish Bilboard/Bilboard.csproj -c Release -o ./publish/bilboard

      - name: Publish Presentation
        run: dotnet publish Presentation/Presentation.csproj -c Release -o ./publish/presentation

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bilboard-artifacts
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bilboard-artifacts

      # Azure deployment (unchanged)
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_68601CB65CF643ABBABB546DE38E0C64 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_99861BAFA9CD48ACA9802C708BD4340F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1EE2B27BF2704B3A9487D4C2FF0CD460 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Bilboard'
          slot-name: 'Production'
          package: publish/bilboard

      # Deploy Bilboard to Hetzner
      - name: Deploy Bilboard to Hetzner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "publish/bilboard/*"
          target: "/var/www/bilboard"

      # Deploy Presentation API to Hetzner
      - name: Deploy Presentation API to Hetzner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "publish/presentation/*"
          target: "/var/www/presentation"

      # Restart both services
      - name: Restart Hetzner services
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            systemctl daemon-reload
            systemctl restart bilboard.service
            systemctl restart presentation.service
            systemctl status bilboard.service --no-pager
            systemctl status presentation.service --no-pager
